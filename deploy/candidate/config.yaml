model_list:
  - model_name: cpa-gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_base: os.environ/CPA_API_BASE
      api_key: os.environ/CPA_API_KEY
    model_info:
      mode: responses
      # Estimated API-equivalent USD/token; docs/candidate/deployment.md records source.
      input_cost_per_token: 0.0000002
      cache_read_input_token_cost: 0.00000002
      cache_creation_input_token_cost: 0.00000025
      output_cost_per_token: 0.0000012
      input_cost_per_token_above_272k_tokens: 0.0000004
      cache_read_input_token_cost_above_272k_tokens: 0.00000004
      cache_creation_input_token_cost_above_272k_tokens: 0.0000005
      output_cost_per_token_above_272k_tokens: 0.0000018

litellm_settings:
  turn_off_message_logging: true
  set_verbose: false
  json_logs: true
  num_retries: 0
  request_timeout: 120
  default_internal_user_params:
    user_role: internal_user
    models: [cpa-gpt-5.6-luna]
    rpm_limit: 10
    tpm_limit: 20000
  default_key_generate_params:
    models: [cpa-gpt-5.6-luna]
    rpm_limit: 10
    tpm_limit: 20000

router_settings:
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  # Local synthetic fixture: no password hash-prefix egress to HIBP.
  password_policy_check_breached_passwords: false
  # One process; native in-memory coordination. No distributed-limit claim.
  disable_error_logs: true
