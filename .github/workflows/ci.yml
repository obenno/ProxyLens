name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  candidate-native-tracing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pinned native callback contract (synthetic, network isolated)
        run: >-
          docker run --rm --network none
          -v "$PWD:/work:ro" --workdir /work --entrypoint python
          ghcr.io/berriai/litellm:v1.106.6@sha256:c09a77d998058dd78835a45a985eae747d257f2b183db06852fba536f3d1113c
          -m unittest discover -s tests -p candidate_native_contract.py

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          # Ephemeral runner only; no credentials or shared service is used.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Hash-locked development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Ruff lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Compose contract
        run: docker compose config --quiet
      - name: Real PostgreSQL integration and recovery (no skipped tests)
        env:
          PROXYLENS_CI_DATABASE_URL: postgresql://postgres@127.0.0.1:55432/postgres
          PROXYLENS_RECOVERY_PG_CONTAINER: ${{ job.services.postgres.id }}
          PROXYLENS_RECOVERY_ENGINE: docker
        run: python scripts/ci-tests.py
