[project]
name = "proxylens"
version = "0.1.0"
description = "ProxyLens integration boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.161.1",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "PyYAML==6.0.3", "ruff==0.17.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
